server {
    listen 80;
    server_name shaheem.site www.shaheem.site;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://13.201.67.122:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    

    location /media/ {
        proxy_pass http://13.201.67.122:8000;
    }
}