

events {
    worker_connections 1024;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://13.201.67.122:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /admin/ {
        proxy_pass http://13.201.67.122:8000;
    }

    location /media/ {
        proxy_pass http://13.201.67.122:8000;
    }
}